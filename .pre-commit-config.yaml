# Install once (inside the venv):  .venv/bin/pre-commit install
# That installs both the pre-commit and pre-push hooks below.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: [tomli]

  - repo: local
    hooks:
      # Full suite on push. Slow (~seconds), so pre-push, not pre-commit.
      # Uses the repo venv explicitly so pushes work from a bare shell.
      - id: pytest
        name: pytest (100% coverage gate)
        entry: .venv/bin/python -m pytest --cov=harness --cov-fail-under=100
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
